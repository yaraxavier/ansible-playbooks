---
- name: Instalar Apache Kafka KRaft (no unico para laboratorio)
  hosts: servicos
  become: true
  vars:
    kafka_version: '4.4.0'
    kafka_scala: '2.13'
    kafka_dir: '/opt/kafka_{{ kafka_scala }}-{{ kafka_version }}'
    kafka_archive: 'kafka_{{ kafka_scala }}-{{ kafka_version }}.tgz'
  tasks:
    - name: Verificar SO
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
    - name: Instalar Java 21 e tar
      ansible.builtin.apt:
        name: [openjdk-21-jre-headless, tar]
        state: present
        update_cache: true
    - name: Criar usuario Kafka
      ansible.builtin.user:
        name: kafka
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Baixar Kafka da Apache
      ansible.builtin.get_url:
        url: 'https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_archive }}'
        dest: '/opt/{{ kafka_archive }}'
        mode: '0644'
    - name: Extrair Kafka
      ansible.builtin.unarchive:
        src: '/opt/{{ kafka_archive }}'
        dest: /opt
        remote_src: true
        creates: '{{ kafka_dir }}'
    - name: Ajustar proprietario da distribuicao
      ansible.builtin.file:
        path: '{{ kafka_dir }}'
        state: directory
        owner: kafka
        group: kafka
        recurse: true
    - name: Preparar diretorio de dados
      ansible.builtin.file:
        path: /var/lib/kafka
        state: directory
        owner: kafka
        group: kafka
        mode: '0750'
    - name: Configurar Kafka local KRaft
      ansible.builtin.copy:
        dest: '{{ kafka_dir }}/config/server.properties'
        owner: kafka
        group: kafka
        mode: '0640'
        content: |
          process.roles=broker,controller
          node.id=1
          controller.quorum.bootstrap.servers=127.0.0.1:9093
          listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
          advertised.listeners=PLAINTEXT://127.0.0.1:9092
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=PLAINTEXT
          log.dirs=/var/lib/kafka
          num.partitions=1
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
      notify: Reiniciar Kafka
    - name: Verificar se armazenamento ja foi formatado
      ansible.builtin.stat:
        path: /var/lib/kafka/meta.properties
      register: kafka_meta
    - name: Gerar UUID do cluster
      ansible.builtin.command:
        cmd: '{{ kafka_dir }}/bin/kafka-storage.sh random-uuid'
      become_user: kafka
      register: kafka_uuid
      changed_when: false
      when: not kafka_meta.stat.exists
    - name: Formatar armazenamento KRaft uma vez
      ansible.builtin.command:
        cmd: '{{ kafka_dir }}/bin/kafka-storage.sh format --standalone -t {{ kafka_uuid.stdout }} -c {{ kafka_dir }}/config/server.properties'
      become_user: kafka
      when: not kafka_meta.stat.exists
    - name: Criar unit systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/kafka.service
        mode: '0644'
        content: |
          [Unit]
          Description=Apache Kafka broker KRaft
          After=network.target
          [Service]
          Type=simple
          User=kafka
          Group=kafka
          WorkingDirectory={{ kafka_dir }}
          ExecStart={{ kafka_dir }}/bin/kafka-server-start.sh {{ kafka_dir }}/config/server.properties
          ExecStop={{ kafka_dir }}/bin/kafka-server-stop.sh
          Restart=on-failure
          RestartSec=10
          LimitNOFILE=100000
          [Install]
          WantedBy=multi-user.target
      notify: Reiniciar Kafka
    - name: Iniciar Kafka
      ansible.builtin.systemd_service:
        name: kafka
        state: started
        enabled: true
        daemon_reload: true
  handlers:
    - name: Reiniciar Kafka
      ansible.builtin.systemd_service:
        name: kafka
        state: restarted
        daemon_reload: true
