---
- name: Instalar RabbitMQ nativamente (Debian/Ubuntu amd64)
  hosts: servicos
  become: true
  vars:
    rabbit_distro: "{{ 'ubuntu' if ansible_facts.distribution == 'Ubuntu' else 'debian' }}"
    rabbit_codename: '{{ ansible_facts.distribution_release }}'
  tasks:
    - name: Validar distribuicao suportada
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution in ['Ubuntu', 'Debian']
          - ansible_facts.architecture == 'x86_64'
          - rabbit_codename in ['jammy', 'noble', 'bookworm', 'trixie']
    - name: Instalar prerequisitos
      ansible.builtin.apt:
        name: [curl, gnupg, ca-certificates, python3-debian]
        state: present
        update_cache: true
    - name: Criar pasta APT
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'
    - name: Baixar chave Team RabbitMQ
      ansible.builtin.get_url:
        url: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
        dest: /usr/share/keyrings/rabbitmq.asc
        mode: '0644'
    - name: Repositorios oficiais RabbitMQ e Erlang
      ansible.builtin.apt_repository:
        repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/rabbitmq.asc] https://deb1.rabbitmq.com/{{ item }}/{{ rabbit_distro }}/{{ rabbit_codename }} {{ rabbit_codename }} main'
        filename: rabbitmq
        state: present
        update_cache: false
      loop: [rabbitmq-erlang, rabbitmq-server]
    - name: Atualizar indice de pacotes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
    - name: Instalar pacotes Erlang recomendados e RabbitMQ
      ansible.builtin.apt:
        name:
          - erlang-base
          - erlang-asn1
          - erlang-crypto
          - erlang-eldap
          - erlang-ftp
          - erlang-inets
          - erlang-mnesia
          - erlang-os-mon
          - erlang-parsetools
          - erlang-public-key
          - erlang-runtime-tools
          - erlang-snmp
          - erlang-ssl
          - erlang-syntax-tools
          - erlang-tftp
          - erlang-tools
          - erlang-xmerl
          - rabbitmq-server
        state: present
    - name: Habilitar e iniciar RabbitMQ
      ansible.builtin.systemd_service:
        name: rabbitmq-server
        state: started
        enabled: true
    - name: Verificar status do broker
      ansible.builtin.command: rabbitmq-diagnostics -q ping
      changed_when: false
# A interface de gerenciamento nao e habilitada automaticamente.
# Credenciais, TLS e regras de rede devem ser configurados conforme a equipe.
